[project]
name = "sautice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "harystyleseze", email = "harystyleseze@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "soundfile>=0.14.0",
    "websockets>=17.1",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "huggingface-hub>=1.31.0",
    "jiwer>=4.0.0",
    "openai>=3.14.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "whisper-normalizer>=0.1.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
